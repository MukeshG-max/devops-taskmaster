apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster
  template:
    metadata:
      labels:
        app: taskmaster
    spec:
      containers:
        - name: taskmaster
          image: 342480083312.dkr.ecr.eu-north-1.amazonaws.com/taskmaster:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "300Mi"
              cpu: "100m"
            limits:
              memory: "500Mi"
              cpu: "300m"
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/taskmaster_db
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root123
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m"
