apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmaster
  template:
    metadata:
      labels:
        app: taskmaster
    spec:
      containers:
      - name: taskmaster
        image: 342480083312.dkr.ecr.eu-north-1.amazonaws.com/taskmaster:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://database-1.cvs4iaegiul2.eu-north-1.rds.amazonaws.com:3306/taskmaster_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "admin"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "kubernetes75488"
