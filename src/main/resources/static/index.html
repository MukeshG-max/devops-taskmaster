<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps TaskMaster</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        background: #0a0a0f;
        color: #e2e8f0;
        display: flex;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        background: linear-gradient(180deg, #111118 0%, #0d0d14 100%);
        padding: 25px 18px;
        border-right: 1px solid #1f1f2e;
        display: flex;
        flex-direction: column;
      }
      .logo {
        font-size: 22px;
        font-weight: 700;
        color: #a78bfa;
        margin-bottom: 40px;
        letter-spacing: 1px;
      }
      .logo span {
        color: #c4b5fd;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #94a3b8;
        padding: 13px 16px;
        text-decoration: none;
        border-radius: 10px;
        margin-bottom: 6px;
        transition: all 0.25s ease;
        font-weight: 500;
      }
      .nav a:hover,
      .nav a.active {
        background: linear-gradient(90deg, #2e1065 0%, #4c1d95 100%);
        color: #e9d5ff;
        transform: translateX(4px);
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
      }
      .nav a i {
        font-size: 18px;
      }

      /* Main */
      .main {
        flex: 1;
        padding: 30px 40px;
        background: #0a0a0f;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
      }
      .header h1 {
        font-size: 28px;
        background: linear-gradient(90deg, #c4b5fd, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .btn {
        background: linear-gradient(135deg, #7c3aed, #a78bfa);
        color: white;
        border: none;
        padding: 11px 22px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.25s;
        box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(124, 58, 237, 0.5);
      }

      /* Cards */
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }
      .card {
        background: #13131a;
        border: 1px solid #1f1f2e;
        border-radius: 16px;
        padding: 22px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #7c3aed, #a78bfa);
      }
      .card:hover {
        transform: translateY(-5px);
        border-color: #7c3aed;
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.15);
      }
      .card h3 {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card p {
        font-size: 32px;
        font-weight: 700;
        color: #c4b5fd;
      }

      /* Charts */
      .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }
      .chart-box {
        background: #13131a;
        border: 1px solid #1f1f2e;
        border-radius: 16px;
        padding: 22px;
        transition: all 0.3s;
      }
      .chart-box:hover {
        border-color: #7c3aed;
        box-shadow: 0 0 25px rgba(124, 58, 237, 0.1);
      }

      /* Table */
      .table-box {
        background: #13131a;
        border: 1px solid #1f1f2e;
        border-radius: 16px;
        padding: 22px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        color: #94a3b8;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px 12px;
        text-align: left;
        border-bottom: 1px solid #1f1f2e;
      }
      td {
        padding: 14px 12px;
        border-bottom: 1px solid #1a1a24;
      }
      tr:hover td {
        background: #1a1a24;
      }

      .status {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .todo {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
      }
      .progress {
        background: rgba(59, 130, 246, 0.15);
        color: #60a5fa;
      }
      .done {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
      }

      .actions button {
        margin-right: 6px;
        padding: 6px 12px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .edit {
        background: #4c1d95;
        color: #e9d5ff;
      }
      .edit:hover {
        background: #6d28d9;
      }
      .delete {
        background: #7f1d1d;
        color: #fecaca;
      }
      .delete:hover {
        background: #991b1b;
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        justify-content: center;
        align-items: center;
        z-index: 100;
      }
      .modal-content {
        background: #13131a;
        border: 1px solid #2e1065;
        border-radius: 18px;
        padding: 32px;
        width: 420px;
        box-shadow: 0 0 50px rgba(124, 58, 237, 0.2);
      }
      .modal h2 {
        color: #c4b5fd;
        margin-bottom: 20px;
      }
      .modal label {
        display: block;
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .modal input,
      .modal select,
      .modal textarea {
        width: 100%;
        padding: 11px 14px;
        margin-bottom: 16px;
        border: 1px solid #2e2e3a;
        border-radius: 10px;
        background: #0a0a0f;
        color: #e2e8f0;
        outline: none;
        transition: border 0.2s;
      }
      .modal input:focus,
      .modal select:focus,
      .modal textarea:focus {
        border-color: #7c3aed;
      }
      .modal-actions {
        display: flex;
        gap: 12px;
        margin-top: 10px;
      }
      .btn-cancel {
        background: #1f1f2e;
        color: #94a3b8;
      }

      /* Views */
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }

      /* Tooltip on hover */
      .card,
      .chart-box,
      .nav a {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">⚡ Task<span>Master</span></div>
      <div class="nav">
        <a href="#" class="active" onclick="showView('dashboard')"
          >📊 Dashboard</a
        >
        <a href="#" onclick="showView('tasks')">📋 All Tasks</a>
        <a href="#" onclick="showView('analytics')">📈 Analytics</a>
      </div>
    </div>

    <div class="main">
      <!-- DASHBOARD VIEW -->
      <div id="dashboard" class="view active">
        <div class="header">
          <h1>DevOps Task Dashboard</h1>
          <button class="btn" onclick="openModal()">+ Add Task</button>
        </div>
        <div class="cards">
          <div class="card">
            <h3>Total Tasks</h3>
            <p id="total">0</p>
          </div>
          <div class="card">
            <h3>To Do</h3>
            <p id="todo">0</p>
          </div>
          <div class="card">
            <h3>In Progress</h3>
            <p id="progress">0</p>
          </div>
          <div class="card">
            <h3>Done</h3>
            <p id="done">0</p>
          </div>
        </div>
        <div class="charts">
          <div class="chart-box"><canvas id="statusChart"></canvas></div>
          <div class="chart-box"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="table-box">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Assigned</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="taskTable"></tbody>
          </table>
        </div>
      </div>

      <!-- ALL TASKS VIEW -->
      <div id="tasks" class="view">
        <div class="header">
          <h1>All Tasks</h1>
          <button class="btn" onclick="openModal()">+ Add Task</button>
        </div>
        <div class="table-box">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Assigned</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="allTasksTable"></tbody>
          </table>
        </div>
      </div>

      <!-- ANALYTICS VIEW -->
      <div id="analytics" class="view">
        <div class="header">
          <h1>Analytics</h1>
        </div>
        <div class="charts">
          <div class="chart-box"><canvas id="analyticsChart1"></canvas></div>
          <div class="chart-box"><canvas id="analyticsChart2"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <h2 id="modalTitle">Add Task</h2>
        <input type="hidden" id="taskId" />
        <label>Title</label>
        <input type="text" id="title" placeholder="Enter task title" />
        <label>Description</label>
        <textarea
          id="description"
          rows="3"
          placeholder="Enter description"
        ></textarea>
        <label>Status</label>
        <select id="status">
          <option>To Do</option>
          <option>In Progress</option>
          <option>Done</option>
        </select>
        <label>Assigned To</label>
        <input type="text" id="assignedTo" placeholder="Who is responsible?" />
        <div class="modal-actions">
          <button class="btn" onclick="saveTask()">Save Task</button>
          <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>

    <script>
      const API = "http://localhost:8080/api/tasks";
      let statusChart, trendChart, analyticsChart1, analyticsChart2;

      function showView(viewId) {
        document
          .querySelectorAll(".view")
          .forEach((v) => v.classList.remove("active"));
        document.getElementById(viewId).classList.add("active");
        document
          .querySelectorAll(".nav a")
          .forEach((a) => a.classList.remove("active"));
        event.target.classList.add("active");
        if (viewId === "analytics") loadAnalytics();
        if (viewId === "tasks") loadAllTasks();
      }

      async function loadTasks() {
        const res = await fetch(API);
        const tasks = await res.json();
        document.getElementById("total").textContent = tasks.length;
        document.getElementById("todo").textContent = tasks.filter(
          (t) => t.status === "To Do",
        ).length;
        document.getElementById("progress").textContent = tasks.filter(
          (t) => t.status === "In Progress",
        ).length;
        document.getElementById("done").textContent = tasks.filter(
          (t) => t.status === "Done",
        ).length;

        const tbody = document.getElementById("taskTable");
        tbody.innerHTML = tasks
          .map(
            (t) => `
                <tr>
                    <td>${t.id}</td>
                    <td>${t.title}</td>
                    <td><span class="status ${t.status === "To Do" ? "todo" : t.status === "In Progress" ? "progress" : "done"}">${t.status}</span></td>
                    <td>${t.assignedTo || "-"}</td>
                    <td class="actions">
                        <button class="edit" onclick="editTask(${t.id})">Edit</button>
                        <button class="delete" onclick="deleteTask(${t.id})">Delete</button>
                    </td>
                </tr>
            `,
          )
          .join("");
        updateCharts(tasks);
      }

      function loadAllTasks() {
        fetch(API)
          .then((r) => r.json())
          .then((tasks) => {
            document.getElementById("allTasksTable").innerHTML = tasks
              .map(
                (t) => `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.title}</td>
                        <td>${t.description || "-"}</td>
                        <td><span class="status ${t.status === "To Do" ? "todo" : t.status === "In Progress" ? "progress" : "done"}">${t.status}</span></td>
                        <td>${t.assignedTo || "-"}</td>
                        <td class="actions">
                            <button class="edit" onclick="editTask(${t.id})">Edit</button>
                            <button class="delete" onclick="deleteTask(${t.id})">Delete</button>
                        </td>
                    </tr>
                `,
              )
              .join("");
          });
      }

      function updateCharts(tasks) {
        const data = [
          tasks.filter((t) => t.status === "To Do").length,
          tasks.filter((t) => t.status === "In Progress").length,
          tasks.filter((t) => t.status === "Done").length,
        ];
        if (statusChart) statusChart.destroy();
        statusChart = new Chart(document.getElementById("statusChart"), {
          type: "doughnut",
          data: {
            labels: ["To Do", "In Progress", "Done"],
            datasets: [
              {
                data,
                backgroundColor: ["#fbbf24", "#60a5fa", "#34d399"],
                borderWidth: 0,
              },
            ],
          },
          options: { plugins: { legend: { labels: { color: "#94a3b8" } } } },
        });
        if (trendChart) trendChart.destroy();
        trendChart = new Chart(document.getElementById("trendChart"), {
          type: "bar",
          data: {
            labels: ["To Do", "In Progress", "Done"],
            datasets: [
              {
                label: "Tasks",
                data,
                backgroundColor: "#7c3aed",
                borderRadius: 6,
              },
            ],
          },
          options: {
            scales: {
              y: { ticks: { color: "#64748b" }, grid: { color: "#1f1f2e" } },
              x: { ticks: { color: "#64748b" }, grid: { display: false } },
            },
            plugins: { legend: { display: false } },
          },
        });
      }

      function loadAnalytics() {
        fetch(API)
          .then((r) => r.json())
          .then((tasks) => {
            const data = [
              tasks.filter((t) => t.status === "To Do").length,
              tasks.filter((t) => t.status === "In Progress").length,
              tasks.filter((t) => t.status === "Done").length,
            ];
            if (analyticsChart1) analyticsChart1.destroy();
            analyticsChart1 = new Chart(
              document.getElementById("analyticsChart1"),
              {
                type: "pie",
                data: {
                  labels: ["To Do", "In Progress", "Done"],
                  datasets: [
                    {
                      data,
                      backgroundColor: ["#fbbf24", "#60a5fa", "#34d399"],
                    },
                  ],
                },
                options: {
                  plugins: { legend: { labels: { color: "#94a3b8" } } },
                },
              },
            );
            if (analyticsChart2) analyticsChart2.destroy();
            analyticsChart2 = new Chart(
              document.getElementById("analyticsChart2"),
              {
                type: "line",
                data: {
                  labels: ["To Do", "In Progress", "Done"],
                  datasets: [
                    {
                      label: "Tasks",
                      data,
                      borderColor: "#a78bfa",
                      backgroundColor: "rgba(167,139,250,0.1)",
                      fill: true,
                      tension: 0.4,
                    },
                  ],
                },
                options: {
                  scales: {
                    y: {
                      ticks: { color: "#64748b" },
                      grid: { color: "#1f1f2e" },
                    },
                    x: {
                      ticks: { color: "#64748b" },
                      grid: { display: false },
                    },
                  },
                  plugins: { legend: { labels: { color: "#94a3b8" } } },
                },
              },
            );
          });
      }

      function openModal(edit = false) {
        document.getElementById("modal").style.display = "flex";
        document.getElementById("modalTitle").textContent = edit
          ? "Edit Task"
          : "Add Task";
        if (!edit) {
          document.getElementById("taskId").value = "";
          document.getElementById("title").value = "";
          document.getElementById("description").value = "";
          document.getElementById("status").value = "To Do";
          document.getElementById("assignedTo").value = "";
        }
      }
      function closeModal() {
        document.getElementById("modal").style.display = "none";
      }

      async function saveTask() {
        const id = document.getElementById("taskId").value;
        const body = {
          title: document.getElementById("title").value,
          description: document.getElementById("description").value,
          status: document.getElementById("status").value,
          assignedTo: document.getElementById("assignedTo").value,
        };
        if (id) {
          await fetch(`${API}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        } else {
          await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        }
        closeModal();
        loadTasks();
        if (document.getElementById("tasks").classList.contains("active"))
          loadAllTasks();
      }

      async function editTask(id) {
        const res = await fetch(`${API}/${id}`);
        const t = await res.json();
        document.getElementById("taskId").value = t.id;
        document.getElementById("title").value = t.title;
        document.getElementById("description").value = t.description || "";
        document.getElementById("status").value = t.status;
        document.getElementById("assignedTo").value = t.assignedTo || "";
        openModal(true);
      }

      async function deleteTask(id) {
        if (confirm("Delete this task?")) {
          await fetch(`${API}/${id}`, { method: "DELETE" });
          loadTasks();
          if (document.getElementById("tasks").classList.contains("active"))
            loadAllTasks();
        }
      }

      loadTasks();
    </script>
  </body>
</html>
