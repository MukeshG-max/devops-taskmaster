<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps TaskMaster</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 240px;
        background: #1e293b;
        padding: 20px;
      }
      .sidebar h2 {
        color: #38bdf8;
        margin-bottom: 30px;
      }
      .sidebar a {
        display: block;
        color: #94a3b8;
        padding: 12px;
        text-decoration: none;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background: #334155;
        color: #38bdf8;
      }
      .main {
        flex: 1;
        padding: 30px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 28px;
      }
      .btn {
        background: #38bdf8;
        color: #0f172a;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn:hover {
        background: #0ea5e9;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }
      .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
      }
      .card h3 {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .card p {
        font-size: 28px;
        font-weight: 700;
        color: #38bdf8;
      }
      .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }
      .chart-box {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
      }
      .table-box {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #334155;
      }
      th {
        color: #94a3b8;
      }
      .status {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .todo {
        background: #fef3c7;
        color: #92400e;
      }
      .progress {
        background: #dbeafe;
        color: #1e40af;
      }
      .done {
        background: #d1fae5;
        color: #065f46;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
      }
      .modal-content {
        background: #1e293b;
        padding: 30px;
        border-radius: 12px;
        width: 400px;
      }
      .modal input,
      .modal select,
      .modal textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0 16px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
      }
      .actions button {
        margin-right: 8px;
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .edit {
        background: #38bdf8;
        color: #0f172a;
      }
      .delete {
        background: #ef4444;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>🚀 TaskMaster</h2>
      <a href="#" class="active">Dashboard</a>
      <a href="#">All Tasks</a>
      <a href="#">Analytics</a>
    </div>
    <div class="main">
      <div class="header">
        <h1>DevOps Task Dashboard</h1>
        <button class="btn" onclick="openModal()">+ Add Task</button>
      </div>
      <div class="cards">
        <div class="card">
          <h3>Total Tasks</h3>
          <p id="total">0</p>
        </div>
        <div class="card">
          <h3>To Do</h3>
          <p id="todo">0</p>
        </div>
        <div class="card">
          <h3>In Progress</h3>
          <p id="progress">0</p>
        </div>
        <div class="card">
          <h3>Done</h3>
          <p id="done">0</p>
        </div>
      </div>
      <div class="charts">
        <div class="chart-box"><canvas id="statusChart"></canvas></div>
        <div class="chart-box"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Status</th>
              <th>Assigned</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="taskTable"></tbody>
        </table>
      </div>
    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <h2 id="modalTitle">Add Task</h2>
        <input type="hidden" id="taskId" />
        <label>Title</label>
        <input type="text" id="title" />
        <label>Description</label>
        <textarea id="description"></textarea>
        <label>Status</label>
        <select id="status">
          <option>To Do</option>
          <option>In Progress</option>
          <option>Done</option>
        </select>
        <label>Assigned To</label>
        <input type="text" id="assignedTo" />
        <button class="btn" onclick="saveTask()">Save</button>
        <button
          class="btn"
          style="background: #64748b; margin-left: 10px"
          onclick="closeModal()"
        >
          Cancel
        </button>
      </div>
    </div>

    <script>
      const API = "http://localhost:8080/api/tasks";
      let statusChart, trendChart;

      async function loadTasks() {
        const res = await fetch(API);
        const tasks = await res.json();
        document.getElementById("total").textContent = tasks.length;
        document.getElementById("todo").textContent = tasks.filter(
          (t) => t.status === "To Do",
        ).length;
        document.getElementById("progress").textContent = tasks.filter(
          (t) => t.status === "In Progress",
        ).length;
        document.getElementById("done").textContent = tasks.filter(
          (t) => t.status === "Done",
        ).length;

        const tbody = document.getElementById("taskTable");
        tbody.innerHTML = tasks
          .map(
            (t) => `
                <tr>
                    <td>${t.id}</td>
                    <td>${t.title}</td>
                    <td><span class="status ${t.status === "To Do" ? "todo" : t.status === "In Progress" ? "progress" : "done"}">${t.status}</span></td>
                    <td>${t.assignedTo || "-"}</td>
                    <td class="actions">
                        <button class="edit" onclick="editTask(${t.id})">Edit</button>
                        <button class="delete" onclick="deleteTask(${t.id})">Delete</button>
                    </td>
                </tr>
            `,
          )
          .join("");

        updateCharts(tasks);
      }

      function updateCharts(tasks) {
        const statusData = [
          tasks.filter((t) => t.status === "To Do").length,
          tasks.filter((t) => t.status === "In Progress").length,
          tasks.filter((t) => t.status === "Done").length,
        ];
        if (statusChart) statusChart.destroy();
        statusChart = new Chart(document.getElementById("statusChart"), {
          type: "doughnut",
          data: {
            labels: ["To Do", "In Progress", "Done"],
            datasets: [
              {
                data: statusData,
                backgroundColor: ["#fbbf24", "#3b82f6", "#10b981"],
              },
            ],
          },
          options: { plugins: { legend: { labels: { color: "#e2e8f0" } } } },
        });
        if (trendChart) trendChart.destroy();
        trendChart = new Chart(document.getElementById("trendChart"), {
          type: "bar",
          data: {
            labels: ["To Do", "In Progress", "Done"],
            datasets: [
              { label: "Tasks", data: statusData, backgroundColor: "#38bdf8" },
            ],
          },
          options: {
            scales: {
              y: { ticks: { color: "#94a3b8" } },
              x: { ticks: { color: "#94a3b8" } },
            },
            plugins: { legend: { display: false } },
          },
        });
      }

      function openModal(edit = false) {
        document.getElementById("modal").style.display = "flex";
        document.getElementById("modalTitle").textContent = edit
          ? "Edit Task"
          : "Add Task";
        if (!edit) {
          document.getElementById("taskId").value = "";
          document.getElementById("title").value = "";
          document.getElementById("description").value = "";
          document.getElementById("status").value = "To Do";
          document.getElementById("assignedTo").value = "";
        }
      }

      function closeModal() {
        document.getElementById("modal").style.display = "none";
      }

      async function saveTask() {
        const id = document.getElementById("taskId").value;
        const body = {
          title: document.getElementById("title").value,
          description: document.getElementById("description").value,
          status: document.getElementById("status").value,
          assignedTo: document.getElementById("assignedTo").value,
        };
        if (id) {
          await fetch(`${API}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        } else {
          await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        }
        closeModal();
        loadTasks();
      }

      async function editTask(id) {
        const res = await fetch(`${API}/${id}`);
        const t = await res.json();
        document.getElementById("taskId").value = t.id;
        document.getElementById("title").value = t.title;
        document.getElementById("description").value = t.description || "";
        document.getElementById("status").value = t.status;
        document.getElementById("assignedTo").value = t.assignedTo || "";
        openModal(true);
      }

      async function deleteTask(id) {
        if (confirm("Delete this task?")) {
          await fetch(`${API}/${id}`, { method: "DELETE" });
          loadTasks();
        }
      }

      loadTasks();
    </script>
  </body>
</html>
